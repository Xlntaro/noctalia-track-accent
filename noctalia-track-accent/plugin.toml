id = "xintaro/noctalia-track-accent"
name = "Track accent for Umbriel"
version = "1.3.0"
plugin_api = 24
author = "xintaro"
license = "MIT"
description = "Uses current MPRIS cover colors for Umbriel's audio-theme border."
tags = ["service", "media", "nixos"]
dependencies = ["systemd (busctl)", "dbus (dbus-monitor)", "python3", "imagemagick (magick or convert)"]

[[setting]]
key = "palette_mode"
type = "select"
label_key = "settings.palette_mode.label"
description_key = "settings.palette_mode.description"
default = "gradient"
options = [
  { value = "gradient", label_key = "settings.palette_mode.gradient" },
  { value = "single", label_key = "settings.palette_mode.single" },
]

[[setting]]
key = "idle_mode"
type = "select"
label_key = "settings.idle_mode.label"
description_key = "settings.idle_mode.description"
default = "native"
options = [
  { value = "native", label_key = "settings.idle_mode.native" },
  { value = "last_cover", label_key = "settings.idle_mode.last_cover" },
  { value = "palette", label_key = "settings.idle_mode.palette" },
  { value = "fixed", label_key = "settings.idle_mode.fixed" },
  { value = "hidden", label_key = "settings.idle_mode.hidden" },
]

[[setting]]
key = "fallback_color"
type = "color"
label_key = "settings.fallback_color.label"
description_key = "settings.fallback_color.description"
default = "#7C6FDC"
visible_when = { key = "idle_mode", values = ["fixed"] }

[[setting]]
key = "silence_brightness_percent"
type = "int"
label_key = "settings.silence_brightness.label"
description_key = "settings.silence_brightness.description"
default = 40
min = 0
max = 100

[[setting]]
key = "spectrum_gain_percent"
type = "int"
label_key = "settings.spectrum_gain.label"
description_key = "settings.spectrum_gain.description"
default = 180
min = 0
max = 300

[[setting]]
key = "bass_gain_percent"
type = "int"
label_key = "settings.bass_gain.label"
description_key = "settings.bass_gain.description"
default = 35
min = 0
max = 150

[[setting]]
key = "max_colors"
type = "int"
label_key = "settings.max_colors.label"
description_key = "settings.max_colors.description"
default = 4
min = 1
max = 4
visible_when = { key = "palette_mode", values = ["gradient"] }

[[setting]]
key = "gradient_speed_percent"
type = "int"
label_key = "settings.gradient_speed.label"
description_key = "settings.gradient_speed.description"
default = 0
min = -50
max = 50
visible_when = { key = "palette_mode", values = ["gradient"] }

[[setting]]
key = "dark_color_floor_percent"
type = "int"
label_key = "settings.dark_color_floor.label"
description_key = "settings.dark_color_floor.description"
default = 50
min = 0
max = 100
advanced = true

[[service]]
id = "track-accent"
entry = "service.luau"
